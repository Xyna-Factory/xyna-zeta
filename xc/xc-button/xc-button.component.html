<button #button
  mat-button mat-ripple
  [disabled]="disabled"
  [attr.type]="type()"
  [attr.aria-label]="ariaLabel"
  [attr.aria-disabled]="disabled"
  [attr.tabindex]="tabDisabled ? '-1' : tabIndex()"
  [attr.cdkFocusInitial]="focusInitial || null"
  >
  <ng-content />
  @if (busy) {
    <xc-progress-bar />
  }
</button>
